# StrikeCast fishing spots
# ---------------------------------------------------------------------------
# Coordinates were snapped to the shoreline using NOAA NCEI CUDEM bathymetry
# (1/9 arc-second, ~3 m) and checked against OpenStreetMap features.
#
# Field reference
#   environment : beach | inlet | jetty | river_mouth | bay | pier
#   water_body  : ocean | bay | sound
#   facing_deg  : compass direction pointing from the shore OUT toward the water
#                 (used for onshore/offshore wind and swell exposure)
#   exposure    : 0-1 share of offshore wave energy that reaches this shoreline
#                 (heuristic; 1.0 = open ocean surf, 0.05 = sheltered bay pier)
#   structure   : features that matter to fish (inlet, jetty, rocks, point,
#                 channel_edge, sandbar, trough, river_mouth, pier, bar)
#   tide_station / current_station : NOAA CO-OPS station ids
#   temp_sources / wave_sources     : ordered candidates "ndbc:<id>" | "coops:<id>"
#                                     The first one with fresh data is used and
#                                     its distance/age is reported.
#   favorite    : always shown on the dashboard
# ---------------------------------------------------------------------------

