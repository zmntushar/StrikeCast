# StrikeCast species & baitfish profiles (Long Island / NY Bight calibration)
# ---------------------------------------------------------------------------
# These are HEURISTIC, configurable parameters assembled from widely published
# angler knowledge and general fisheries literature. They produce environmental
# SUITABILITY indices (0-100), not calibrated catch probabilities. Once you log
# trips in the Fishing Log, StrikeCast can train a model on your own data.
#
# season: list of [day_of_year, value 0-1] points (south-shore Long Island,
#         reference latitude 40.7 N). Linear interpolation, wraps around the year.
# temp_f: [min, opt_low, opt_high, max] trapezoid of water temperature (deg F).
# light : multipliers for night / dawn / day / dusk (dawn & dusk = civil
#         twilight +/- 1 h around sunrise/sunset).
# current_opt: [low, high] preferred share of the tidal cycle's peak current.
# waves_ft: [flat_ok, opt_low, opt_high, too_rough] nearshore wave height.
# structure: affinity 0-1 for spot structure tags (best match wins, others add).
# diet: weights over baitfish groups (empty = invertebrate feeder).
# storm: multipliers before / during / after (12-72 h) storm events.
# ---------------------------------------------------------------------------

reference_latitude: 40.7
latitude_shift_days_per_degree: 6      # migrations arrive later / leave earlier further north
water_body_shift_days: {bay: -5, ocean: 0, sound: 6}   # +: fall run later / spring later

