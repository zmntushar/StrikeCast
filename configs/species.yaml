# Storm detection thresholds (configurable — effects above are per species).
storm:
  wind_mph: 25           # sustained wind threshold
  min_hours: 3           # sustained for at least this long
  offshore_wave_ft: 8    # or offshore significant wave height above this
  pressure_drop_12h_hpa: -8
  post_window_hours: 72
  pre_window_hours: 12
